<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario Interactivo - I.E.S. Villablanca</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #0f172a, #1e1b4b, #020617);
      background-attachment: fixed;
    }

    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Glassmorphism Styles */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .glass-header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Glowing Effects */
    .glow-blue {
      box-shadow: 0 0 35px -5px rgba(59, 130, 246, 0.4);
    }

    .glow-purple {
      box-shadow: 0 0 35px -5px rgba(147, 51, 234, 0.4);
    }

    /* Smooth Transitions for Table Swap */
    .fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Hover animations for schedule cells */
    .subject-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .subject-card:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-full text-slate-100 flex flex-col items-center justify-between p-4 md:p-8 relative overflow-x-hidden">

  <div class="fixed top-[-10%] left-[-10%] w-[45vw] h-[45vw] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[45vw] h-[45vw] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <header class="w-full max-w-6xl text-center mb-8 relative z-10">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold tracking-wider uppercase mb-4 backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
      I.E.S. Villablanca • Madrid
    </div>
    <h1 id="titulo" class="font-heading text-4xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-indigo-200 mb-2">
      ASIR2 - Horario de Mañana
    </h1>
    <p id="subtitulo" class="text-slate-400 text-sm md:text-base font-normal max-w-lg mx-auto">
      Administración de Sistemas Informáticos en Red
    </p>
  </header>

  <div class="mb-8 relative z-10">
    <button id="toggleBtn" onclick="cambiarTurno()" class="group relative inline-flex items-center gap-3 px-8 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 text-white font-bold text-base shadow-xl glow-blue hover:glow-purple transition-all duration-300 hover:scale-105 active:scale-95 border border-white/20">
      <svg class="w-5 h-5 transition-transform duration-500 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
      </svg>
      <span id="btnText">Ver Horario de Tarde (DAM2)</span>
    </button>
  </div>

  <main class="w-full max-w-6xl glass-card rounded-3xl overflow-hidden relative z-10 mb-8 border border-white/10">
    <div class="overflow-x-auto">
      <table class="w-full border-collapse min-w-[800px]">
        <thead>
          <tr class="glass-header text-center">
            <th class="py-5 px-4 text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-white/10 w-28">Horario</th>
            <th class="py-5 px-4 text-xs font-bold uppercase tracking-wider text-indigo-300 border-b border-white/10">Lunes</th>
            <th class="py-5 px-4 text-xs font-bold uppercase tracking-wider text-indigo-300 border-b border-white/10">Martes</th>
            <th class="py-5 px-4 text-xs font-bold uppercase tracking-wider text-indigo-300 border-b border-white/10">Miércoles</th>
            <th class="py-5 px-4 text-xs font-bold uppercase tracking-wider text-indigo-300 border-b border-white/10">Jueves</th>
            <th class="py-5 px-4 text-xs font-bold uppercase tracking-wider text-indigo-300 border-b border-white/10">Viernes</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla" class="divide-y divide-white/5">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-500 relative z-10 pb-4">
    <p>© 2026 I.E.S. Villablanca • Aplicación Web Interactiva HTML5 / CSS3 / JavaScript</p>
  </footer>

  <script>
    let esManana = true;

    // Color definitions per subject category
    const subjectStyles = {
      // ASIR Morning Subjects
      "Inglés profesional": "bg-sky-500/10 border-sky-500/30 text-sky-300",
      "Seguridad y alta dis": "bg-rose-500/10 border-rose-500/30 text-rose-300",
      "Implantación de apl": "bg-emerald-500/10 border-emerald-500/30 text-emerald-300",
      "Sostenibilidad aplic": "bg-teal-500/10 border-teal-500/30 text-teal-300",
      "Servicios de red e I": "bg-blue-500/10 border-blue-500/30 text-blue-300",
      "AdmDeSisGesDeBasDeDa": "bg-amber-500/10 border-amber-500/30 text-amber-300",
      "Administración de si": "bg-indigo-500/10 border-indigo-500/30 text-indigo-300",
      "Ciberseguridad": "bg-purple-500/10 border-purple-500/30 text-purple-300",
      "Itinerario personal": "bg-pink-500/10 border-pink-500/30 text-pink-300",
      "DigAplALosSecPro (G5)": "bg-cyan-500/10 border-cyan-500/30 text-cyan-300",

      // DAM Evening Subjects
      "Desarrollo de Interfaces": "bg-violet-500/10 border-violet-500/30 text-violet-300",
      "Acceso a Datos": "bg-orange-500/10 border-orange-500/30 text-orange-300",
      "Prog. Multimedia": "bg-fuchsia-500/10 border-fuchsia-500/30 text-fuchsia-300",
      "Procesos y Servicios": "bg-red-500/10 border-red-500/30 text-red-300",
      "Sistemas de Gestión": "bg-lime-500/10 border-lime-500/30 text-lime-300",
      "Empresa e Iniciativa": "bg-yellow-500/10 border-yellow-500/30 text-yellow-300",
      "Proyecto DAM": "bg-indigo-500/10 border-indigo-500/30 text-indigo-300",
      "Itinerario Personal DAM": "bg-pink-500/10 border-pink-500/30 text-pink-300",
      "Inglés Técnico": "bg-sky-500/10 border-sky-500/30 text-sky-300"
    };

    function createCell(title, prof, room) {
      const style = subjectStyles[title] || "bg-slate-500/10 border-slate-500/30 text-slate-300";
      return `
        <td class="p-2">
          <div class="subject-card ${style} border rounded-xl p-2.5 flex flex-col justify-between h-full min-h-[72px]">
            <span class="font-bold text-xs leading-tight tracking-wide mb-1">${title}</span>
            <div class="flex items-center justify-between text-[10px] opacity-80 mt-1">
              <span>${prof}</span>
              <span class="px-1.5 py-0.5 rounded-md bg-black/30 font-mono text-[9px] border border-white/5">${room}</span>
            </div>
          </div>
        </td>
      `;
    }

    // Exact Morning Schedule (ASIR2)
    const horarioManana = `
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">08:15 - 09:10</td>
        ${createCell('Inglés profesional', 'Cuev. Mo. Si', 'B1.07')}
        ${createCell('Itinerario personal', 'Mora. Es. Es', 'B1.07')}
        ${createCell('DigAplALosSecPro (G5)', 'Torr. Mu. Ra', 'B1.07')}
        ${createCell('Itinerario personal', 'Mora. Es. Es', 'B1.07')}
        ${createCell('Servicios de red e I', 'Cast. Pa. Be', 'B1.07')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">09:10 - 10:05</td>
        ${createCell('Inglés profesional', 'Cuev. Mo. Si', 'B1.07')}
        ${createCell('Seguridad y alta dis', 'Mart. Av. Su', 'B1.07')}
        ${createCell('Implantación de apl', 'Mart. Av. Su', 'B1.07')}
        ${createCell('Seguridad y alta dis', 'Mart. Av. Su', 'B1.07')}
        ${createCell('Servicios de red e I', 'Cast. Pa. Be', 'B1.07')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">10:05 - 11:00</td>
        ${createCell('AdmDeSisGesDeBasDeDa', 'Informatica 2', 'B1.07')}
        ${createCell('Administración de si', 'SAI 1', 'B1.07')}
        ${createCell('Ciberseguridad', 'Leto. Ri. M', 'B1.07')}
        ${createCell('AdmDeSisGesDeBasDeDa', 'Informatica 2', 'B1.07')}
        ${createCell('Sostenibilidad aplic', 'Mora. Es. Es', 'B1.07')}
      </tr>
      <tr class="bg-amber-500/10 text-amber-300 font-bold text-center border-y border-amber-500/20">
        <td class="font-mono text-xs py-2 bg-amber-500/5">11:00 - 11:30</td>
        <td colspan="5" class="tracking-[0.3em] uppercase text-xs py-2">☕ Recreo</td>
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">11:30 - 12:25</td>
        ${createCell('AdmDeSisGesDeBasDeDa', 'Informatica 2', 'B1.07')}
        ${createCell('Administración de si', 'SAI 1', 'B1.07')}
        ${createCell('Ciberseguridad', 'Leto. Ri. M', 'B1.07')}
        ${createCell('Implantación de apl', 'Mart. Av. Su', 'B1.07')}
        ${createCell('Ciberseguridad', 'Leto. Ri. M', 'B1.07')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">12:25 - 13:20</td>
        ${createCell('Administración de si', 'SAI 1', 'B1.07')}
        ${createCell('Seguridad y alta dis', 'Mart. Av. Su', 'B1.07')}
        ${createCell('Administración de si', 'SAI 1', 'B1.07')}
        ${createCell('Servicios de red e I', 'Cast. Pa. Be', 'B1.07')}
        ${createCell('Seguridad y alta dis', 'Mart. Av. Su', 'B1.07')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">13:20 - 14:15</td>
        ${createCell('Administración de si', 'SAI 1', 'B1.07')}
        ${createCell('Servicios de red e I', 'Cast. Pa. Be', 'B1.07')}
        ${createCell('Implantación de apl', 'Mart. Av. Su', 'B1.07')}
        ${createCell('Servicios de red e I', 'Cast. Pa. Be', 'B1.07')}
        ${createCell('Seguridad y alta dis', 'Mart. Av. Su', 'B1.07')}
      </tr>
    `;

    // Adapted Evening Schedule (DAM2)
    const horarioTarde = `
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">15:30 - 16:25</td>
        ${createCell('Desarrollo de Interfaces', 'Lóp. Ga. An', 'B2.01')}
        ${createCell('Acceso a Datos', 'Sán. Pe. Lu', 'B2.01')}
        ${createCell('Prog. Multimedia', 'Góm. Rí. Ma', 'B2.01')}
        ${createCell('Prog. Multimedia', 'Góm. Rí. Ma', 'B2.01')}
        ${createCell('Desarrollo de Interfaces', 'Lóp. Ga. An', 'B2.01')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">16:25 - 17:20</td>
        ${createCell('Desarrollo de Interfaces', 'Lóp. Ga. An', 'B2.01')}
        ${createCell('Acceso a Datos', 'Sán. Pe. Lu', 'B2.01')}
        ${createCell('Prog. Multimedia', 'Góm. Rí. Ma', 'B2.01')}
        ${createCell('Prog. Multimedia', 'Góm. Rí. Ma', 'B2.01')}
        ${createCell('Procesos y Servicios', 'Rui. He. Ca', 'B2.01')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">17:20 - 18:15</td>
        ${createCell('Acceso a Datos', 'Sán. Pe. Lu', 'B2.01')}
        ${createCell('Sistemas de Gestión', 'Día. Fe. Ja', 'B2.01')}
        ${createCell('Acceso a Datos', 'Sán. Pe. Lu', 'B2.01')}
        ${createCell('Procesos y Servicios', 'Rui. He. Ca', 'B2.01')}
        ${createCell('Procesos y Servicios', 'Rui. He. Ca', 'B2.01')}
      </tr>
      <tr class="bg-amber-500/10 text-amber-300 font-bold text-center border-y border-amber-500/20">
        <td class="font-mono text-xs py-2 bg-amber-500/5">18:15 - 18:30</td>
        <td colspan="5" class="tracking-[0.3em] uppercase text-xs py-2">☕ Recreo</td>
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">18:30 - 19:25</td>
        ${createCell('Acceso a Datos', 'Sán. Pe. Lu', 'B2.01')}
        ${createCell('Sistemas de Gestión', 'Día. Fe. Ja', 'B2.01')}
        ${createCell('Empresa e Iniciativa', 'Tor. Va. Mj', 'B2.01')}
        ${createCell('Sistemas de Gestión', 'Día. Fe. Ja', 'B2.01')}
        ${createCell('Empresa e Iniciativa', 'Tor. Va. Mj', 'B2.01')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">19:25 - 20:20</td>
        ${createCell('Sistemas de Gestión', 'Día. Fe. Ja', 'B2.01')}
        ${createCell('Desarrollo de Interfaces', 'Lóp. Ga. An', 'B2.01')}
        ${createCell('Empresa e Iniciativa', 'Tor. Va. Mj', 'B2.01')}
        ${createCell('Sistemas de Gestión', 'Día. Fe. Ja', 'B2.01')}
        ${createCell('Proyecto DAM', 'Coordinador DAM', 'B2.01')}
      </tr>
      <tr class="hover:bg-white/[0.02]">
        <td class="font-mono text-xs font-semibold text-center text-slate-400 py-3 bg-black/20">20:20 - 21:15</td>
        ${createCell('Itinerario Personal DAM', 'Tor. Va. Mj', 'B2.01')}
        ${createCell('Inglés Técnico', 'Mar. Gi. Ro', 'B2.01')}
        ${createCell('Procesos y Servicios', 'Rui. He. Ca', 'B2.01')}
        ${createCell('Proyecto DAM', 'Coordinador DAM', 'B2.01')}
        ${createCell('Proyecto DAM', 'Coordinador DAM', 'B2.01')}
      </tr>
    `;

    function render() {
      const cuerpoTabla = document.getElementById('cuerpoTabla');
      const titulo = document.getElementById('titulo');
      const subtitulo = document.getElementById('subtitulo');
      const btnText = document.getElementById('btnText');

      cuerpoTabla.classList.remove('fade-in');
      void cuerpoTabla.offsetWidth; // Trigger reflow for animation restart

      if (esManana) {
        cuerpoTabla.innerHTML = horarioManana;
        titulo.innerText = 'ASIR2 - Horario de Mañana';
        subtitulo.innerText = 'Administración de Sistemas Informáticos en Red';
        btnText.innerText = 'Ver Horario de Tarde (DAM2)';
      } else {
        cuerpoTabla.innerHTML = horarioTarde;
        titulo.innerText = 'DAM2 - Horario de Tarde';
        subtitulo.innerText = 'Desarrollo de Aplicaciones Multiplataforma';
        btnText.innerText = 'Ver Horario de Mañana (ASIR2)';
      }

      cuerpoTabla.classList.add('fade-in');
    }

    function cambiarTurno() {
      esManana = !esManana;
      render();
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
